pipeline:
  name: Java War
  identifier: Java_War
  projectIdentifier: grand_line
  orgIdentifier: default
  properties:
    ci:
      codebase:
        repoName: harness
        connectorRef: github_main
        build: <+input>
        branch: main
        path: services/merry
  tags: {}
  stages:
    - stage:
        name: Build
        identifier: Build
        description: ""
        type: CI
        spec:
          cloneCodebase: true
          caching:
            enabled: true
            override: true
            paths: []
          buildIntelligence:
            enabled: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: Run
                  name: Build
                  identifier: Build
                  spec:
                    connectorRef: dockerhub_main
                    image: docker.io/library/maven:3.9-eclipse-temurin-17
                    shell: Bash
                    command: |-
                      cd /harness/services/merry
                      echo "→ Building WAR..."
                      mvn clean package -q -DskipTests
                      echo "→ WAR created:"
                      ls -la target/*.war
              - step:
                  type: Run
                  name: Package
                  identifier: Package
                  spec:
                    shell: Bash
                    command: |-
                      cd /harness/services/merry

                      APP_NAME="merry"
                      VERSION="1.0.<+pipeline.sequenceId>"
                      TAR_NAME="${APP_NAME}-v${VERSION}.tar.gz"

                      mkdir -p dist

                      echo "→ Creating TAR package..."

                      # First, find the actual WAR filename
                      WAR_FILE=$(ls target/*.war | head -1)
                      WAR_BASENAME=$(basename $WAR_FILE)

                      echo "→ Found WAR: $WAR_BASENAME"

                      # Create TAR with correct paths
                      tar -czvf dist/${TAR_NAME} \
                        -C target ${WAR_BASENAME} \
                        -C ../config .

                      echo "→ TAR created:"
                      ls -la dist/

                      echo "TAR_PATH=/harness/services/merry/dist/${TAR_NAME}" >> $HARNESS_OUTPUT_FILE
                    outputVariables:
                      - name: VERSION
                        type: String
                        value: VERSION
                    outputAlias:
                      key: VERSION
                      scope: Pipeline
              - step:
                  type: S3Upload
                  name: S3Upload_1
                  identifier: S3Upload_1
                  spec:
                    connectorRef: s3_connector
                    region: us-east-1
                    bucket: bes-innovation-artifact
                    sourcePath: /harness/services/merry/dist/*.tar.gz
                    target: merry
    - stage:
        name: Deploy War
        identifier: Deploy_War
        description: ""
        type: Deployment
        spec:
          deploymentType: Ssh
          service:
            serviceRef: War_Service
          environment:
            environmentRef: development
            deployToAll: false
            infrastructureDefinitions:
              - identifier: ssh_aws_conecction
                inputs:
                  identifier: ssh_aws_conecction
                  type: SshWinRmAws
                  spec:
                    targetedHosts: <+input>
          execution:
            steps:
              - step:
                  type: Command
                  name: Download Artifact e Deploy
                  identifier: Download_Artifact_e_Deploy
                  spec:
                    onDelegate: false
                    environmentVariables: []
                    outputVariables: []
                    commandUnits:
                      - identifier: Download
                        name: Download
                        type: DownloadArtifact
                        spec:
                          destinationPath: /home/ubuntu/s3-artifactory/
                      - identifier: Extract_War
                        name: Extract War
                        type: Script
                        spec:
                          workingDirectory: /home/ubuntu/s3-artifactory
                          shell: Bash
                          source:
                            type: Inline
                            spec:
                              script: tar -xzf merry-v1.0.<+pipeline.sequenceId>.tar.gz
                      - identifier: Deploy
                        name: Copy
                        type: Script
                        spec:
                          workingDirectory: /home/ubuntu/s3-artifactory
                          shell: Bash
                          source:
                            type: Inline
                            spec:
                              script: sudo cp merry.war /opt/tomcat/webapps/merry.war
                      - identifier: Cleanup
                        name: Cleanup
                        type: Script
                        spec:
                          workingDirectory: ""
                          shell: Bash
                          source:
                            type: Inline
                            spec:
                              script: sudo rm -rf /home/ubuntu/s3-artifactory/*
                    delegateSelectors:
                      - linux-amd64
                  timeout: 10m
                  strategy:
                    repeat:
                      items: <+stage.output.hosts>
            rollbackSteps:
              - step:
                  name: Rollback
                  identifier: Deploy
                  timeout: 10m
                  strategy:
                    repeat:
                      items: <+stage.output.hosts>
                  template:
                    templateRef: account.Default_Install_War_Bash
                    templateInputs:
                      type: Command
                      spec:
                        environmentVariables:
                          - name: DestinationDirectory
                            type: String
                            value: $HOME/<+service.name>/<+env.name>
        tags: {}
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: StageRollback
