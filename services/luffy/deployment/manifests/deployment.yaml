apiVersion: apps/v1
kind: Deployment
metadata:
  name: luffy-services
  labels:
    helm.sh/chart: luffy-apps-0.1.0
    app.kubernetes.io/name: luffy-apps
    app.kubernetes.io/instance: luffy-app
    app.kubernetes.io/version: "1.16.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: luffy-apps
      app.kubernetes.io/instance: luffy-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: luffy-apps
        app.kubernetes.io/instance: luffy-app
    spec:
      imagePullSecrets:
        - name: regcred
      serviceAccountName: luffy-services
      securityContext:
        {}
      containers:
        - name: luffy-apps
          securityContext:
            {}
          image: "560978416398.dkr.ecr.us-east-1.amazonaws.com/luffy-services:v9.0.0"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            {}